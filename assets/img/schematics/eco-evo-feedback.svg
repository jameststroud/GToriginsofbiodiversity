<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="t d">
<title id="t">Eco-evolutionary feedback loop</title><desc id="d">Ecological change alters selection, causing evolutionary change, which in turn alters ecological interactions.</desc>
<rect width="760" height="330" fill="#FFFDF3"/>
<defs><marker id="g" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F5D50"/></marker><marker id="v" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4E8C"/></marker></defs>
<rect x="60" y="110" width="240" height="110" rx="12" fill="#FFFDF3" stroke="#2F5D50" stroke-width="2.5"/>
<text x="180" y="160" text-anchor="middle" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif" stroke="#FFFDF3" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-size="21" font-weight="600" fill="#1F2A24">Ecological change</text>
<text x="180" y="188" text-anchor="middle" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif" stroke="#FFFDF3" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-size="15" fill="#54585A">populations, communities</text>
<rect x="460" y="110" width="240" height="110" rx="12" fill="#FFFDF3" stroke="#6B4E8C" stroke-width="2.5"/>
<text x="580" y="160" text-anchor="middle" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif" stroke="#FFFDF3" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-size="21" font-weight="600" fill="#1F2A24">Evolutionary change</text>
<text x="580" y="188" text-anchor="middle" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif" stroke="#FFFDF3" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-size="15" fill="#54585A">traits, allele frequencies</text>
<path d="M190,102 C260,34 500,34 570,102" fill="none" stroke="#2F5D50" stroke-width="3" marker-end="url(#g)"/>
<path d="M570,228 C500,296 260,296 190,228" fill="none" stroke="#6B4E8C" stroke-width="3" marker-end="url(#v)"/>
<text x="380" y="34" dy="-8" text-anchor="middle" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif" stroke="#FFFDF3" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-size="16" fill="#1F2A24">alters selection</text>
<text x="380" y="312" dy="8" text-anchor="middle" font-family="Source Sans 3, Helvetica Neue, Arial, sans-serif" stroke="#FFFDF3" stroke-width="5" stroke-linejoin="round" paint-order="stroke" font-size="16" fill="#1F2A24">alters ecological interactions</text>
</svg>
