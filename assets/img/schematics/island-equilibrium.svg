<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" role="img" aria-labelledby="t d">
<title id="t">Equilibrium theory of island biogeography</title><desc id="d">Immigration rate falls and extinction rate rises with the number of species on an island. Their intersections give the equilibrium number of species, lowest for far small islands and highest for near large islands.</desc>
<rect width="760" height="520" fill="#FFFDF3"/>
