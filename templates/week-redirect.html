<meta name="robots" content="noindex, nofollow">
<script>
  // Old addresses such as week.html?n=5 forward to the week's own page, week-05.html,
  // keeping any other settings (for example ?drafts=1) and the #section.
  (function () {
    var p = new URLSearchParams(location.search);
    var n = parseInt(p.get("n"), 10);
    if (n >= 1 && n <= 99) {
      p.delete("n");
      var q = p.toString();
      location.replace("week-" + (n < 10 ? "0" : "") + n + ".html" + (q ? "?" + q : "") + location.hash);
    }
  })();
</script>
